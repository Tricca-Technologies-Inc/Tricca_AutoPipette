# ============================================================================
# pyproject.toml
#
# Central configuration for:
#   - Packaging
#   - Dependencies
#   - Ruff (linting + formatting)
#   - Pyright
#   - Pytest
#   - Coverage
#
# Python version: 3.12+
# ============================================================================

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"


[project]
name = "tricca-autopipette"
version = "0.1.0"
description = "Automation software for the Tricca AutoPipette"

requires-python = ">=3.12"

dependencies = [
    "aiohttp",
    "cmd2",
    "opencv-python",
    "pydantic>=2",
    "requests",
    "websockets",
    "numpy",
    "fastapi",
    "uvicorn",
]

authors = [
    { name = "James Cook" },
]

readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]


[project.optional-dependencies]

# Development tools.
dev = [
    "coverage",
    "httpx2",  # starlette.testclient.TestClient's transport, for kiosk tests
    "pyright",
    "pytest",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
]


# ============================================================================
# Ruff
# ============================================================================

[tool.ruff]

target-version = "py312"
line-length = 88
preview = true

# Exclude common generated directories.
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]

select = [
    # Pycodestyle
    "E",
    "W",

    # Pyflakes
    "F",

    # isort
    "I",

    # Pyupgrade
    "UP",

    # flake8-bugbear
    "B",

    # flake8-simplify
    "SIM",

    # flake8-comprehensions
    "C4",

    # Return statement improvements
    "RET",

    # Ruff-specific rules
    "RUF",

    # Type annotations
    "ANN",

    # Docstrings
    "D",

    # pydoclint -- docstring vs. actual signature/Returns/Raises drift
    "DOC",
]

ignore = [
    # Google-style docstrings
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
]

# "8×12 wells", "prewet×2" -- the multiplication sign is the intended
# character in these display strings, and RUF001's suggested ASCII "x" is
# a downgrade. Micro sign (U+00B5) is deliberately NOT allowlisted: it is
# normalized to GREEK SMALL LETTER MU (U+03BC) throughout, per NFKC.
allowed-confusables = ["×"]


[tool.ruff.lint.per-file-ignores]

# Test names are the documentation; don't require docstrings/type
# annotations on every test function.
"tests/**" = ["D", "ANN"]

# ASCII-art banners: the "lines" are rows of a picture, and rich markup
# tags make them long. Wrapping them would break the art.
"src/tricca_autopipette/resources/string_constants.py" = ["line-too-long"]


[tool.ruff.lint.isort]

known-first-party = [
    "tricca_autopipette", "autopipette_kiosk"
]

combine-as-imports = true


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false


[tool.ruff.format]

quote-style = "double"
indent-style = "space"
docstring-code-format = true


# ============================================================================
# Pyright
# ============================================================================

[tool.pyright]

# Resolve imports against the project virtualenv, not whatever interpreter
# pyright happens to find. Without this, pydantic/pytest/aiohttp/fastapi are
# all unresolved and strict mode cascades every value flowing out of them
# into reportUnknown* -- which inflated the error count from 187 to 648.
venvPath = "."
venv = ".venv"

pythonVersion = "3.12"

typeCheckingMode = "strict"

reportMissingImports = true
reportMissingTypeStubs = false

reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true

extraPaths = ["src", "scripts"]

# The service/daemon tests are deliberately white-box: they assert against
# `service._autopipette`, drive `ControlServer._call` directly, and check
# `_dispatch_protocol_line`. Reaching into those internals is the point of
# those tests, not an encapsulation break, so don't flag it under tests/.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

# Everything else keeps the strict defaults from above.
[[tool.pyright.executionEnvironments]]
root = "."


# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]

# "src" only matters when --doctest-modules is passed explicitly (see
# Commands in CLAUDE.md) -- pytest's default `test_*.py` collection pattern
# never matches anything under src/, so plain `pytest` is unaffected by its
# presence here. Without it, `pytest --doctest-modules` (no path arg) would
# fall back to testpaths and find nothing, since none of the doctests live
# under tests/.
testpaths = ["tests", "src"]

pythonpath = [
    "src",
    "scripts",
]

addopts = "-ra"


# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]

branch = true

source = [
    "tricca_autopipette",
    "autopipette_kiosk",
]

[project.scripts]
tap = "tricca_autopipette.cli.main:main"
tapd = "tricca_autopipette.daemon.main:main"

[tool.setuptools.package-data]
autopipette_kiosk = ["static/*"]

