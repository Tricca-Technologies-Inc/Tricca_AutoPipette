# plate-macros.cfg -- plate axes, pipette axis P, homing, collision interlock
#
# Part of Tricca_Autopipette_Configs. Reference implementation from the
# AutoPipette axis-expansion plan (WP2). No MCU serial IDs or CAN UUIDs here:
# bootstrap.sh writes [mcu], [mcu EBBCan] and [mcu octopus] into the machine's
# printer.cfg.
#
# Coordinates: "raw" = printer.gcode_move.position (machine coordinates, immune
# to G92 / SET_GCODE_OFFSET). Z0 = tip fully raised; larger Z lowers the tip.
#
# Interlock rules (umbrella plan, section 6.2):
#   I1  plate axis in a G1/G0: Z homed, raw Z <= z_safe now and at the target,
#       every moving plate homed
#   I2  G1/G0 lowering the tip below z_safe: every plate homed AND parked
#   I3  MANUAL_STEPPER on a plate: only from plate macros (_PLATE_INTERNAL=1)
#   I4  HOME_PLATE(S): Z homed and raw Z <= z_safe
#   I5  disabling a stepper (M84/M18, SET_STEPPER_ENABLE, idle, a failed G28)
#       or a restart/E-stop makes it unhomed
#   I6  P in a G1/G0: plunger homed and P bound
#
# Every Klipper command that can move Z or a plate goes through a check here:
#   G1/G0 (wrapped)                     I1, I2, I6
#   SET_GCODE_OFFSET ... MOVE=1         I2 on the resulting Z move
#   RESTORE_GCODE_STATE ... MOVE=1      I2 on the restored Z (this is also how
#                                       RESUME moves back after a PAUSE)
#   STEPPER_BUZZ                        plates: tip safe; Z steppers: I2
#   MANUAL_STEPPER                      I3 (plates); plunger rules per stage
#   G28                                 homing_override -> HOME_PLATE (I4);
#                                       unknown letters refused. G28 Z's own
#                                       3 mm retract dips the tip to raw Z 3:
#                                       owner-confirmed clear of every drawer
#   MANUAL_PROBE, Z_ENDSTOP_CALIBRATE   refused outright (their TESTZ moves Z
#                                       directly; not used on this machine)
# The offline tests compare Klipper's full command list against a reviewed
# inventory (reference/tests/command-inventory.txt), so a new command can't
# slip in unclassified.
# Known limits (WP2 section 4): commanded state only (skipped belt steps are
# not detected); the renamed originals (G1.1, G0.1, *_BASE, M84.1, M18.1),
# _PLATE_INTERNAL=1 and SET_GCODE_VARIABLE on the interlock's own macros bypass
# the checks by design -- never send them from tapd or by hand; [gcode_arcs]
# and FORCE_MOVE must stay disabled; every G1 runs this template on the CB1
# (latency measured in M-15).

[gcode_macro _PLATE_CFG]
description: Plate axis map and interlock parameters (per-machine values set via RB1)
variable_axes: {'plate1':'U','plate2':'V','plate3':'W','plate4':'A','plate5':'B','plate6':'C'}
variable_z_safe: 0.0          # D18: tip is clear of plates when raw Z <= z_safe (Z0 = fully raised). Owner keeps 0.0 (plan Rev I)
variable_park_tol: 0.1        # mm
variable_limit_velocity: 50   # mm/s, bound-axis limit
variable_limit_accel: 500     # mm/s^2
variable_home_speed: 50          # mm/s fast pass; 350 mm worst case ~7 s per plate
variable_home_speed_slow: 5
variable_home_backoff: 3      # mm; the switch must release within this distance (S-6)
gcode:

[gcode_macro _PLATE_STATE]
description: Per-plate homed flags (reset on every Klipper restart)
variable_plate1: 0
variable_plate2: 0
variable_plate3: 0
variable_plate4: 0
variable_plate5: 0
variable_plate6: 0
gcode:

# --- Pipette on axis P (D20-D24) ---------------------------------------------
[gcode_macro _PIPETTE_CFG]
description: Pipette coordinated-motion axis
variable_axis: 'P'
variable_limit_velocity: 50    # D23: app's upper bound for syringe speed (mm/s)
variable_limit_accel: 200      # D23: app's upper bound for syringe accel (mm/s^2)
variable_home_dir: 1           # PROPOSED (umbrella §8): derived from tapd's homing move; verify in Phase 0
variable_max_travel: 60        # p100_vertical syringe.max_travel_mm (also the app's upper bound)
variable_home_speed: 50        # p100_vertical speed_dispense, which tapd homes at today (mm/s)
variable_home_accel: 200       # p100_vertical accel_home (mm/s^2)
# Stage (D28): 1 = today's tapd plunger commands work (transparent rebind);
# 2 = tapd uses G28 P + absolute G1 P only, and any direct MANUAL_STEPPER on the
# plunger clears its homed state. Stage 2 also needs position_min/max on
# [manual_stepper pipette_stepper] (stage2.patch.md).
variable_stage: 1
gcode:

[gcode_macro _PIPETTE_STATE]
description: Plunger homed flag (reset on every Klipper restart)
variable_homed: 0
gcode:

# --- I5: clear every homed flag (motors off) ---------------------------------
[gcode_macro _CLEAR_HOMED]
description: Mark all plates and the plunger unhomed (internal)
gcode:
  {% for p in printer["gcode_macro _PLATE_CFG"].axes %}
    SET_GCODE_VARIABLE MACRO=_PLATE_STATE VARIABLE={p} VALUE=0
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0

[gcode_macro M84]
rename_existing: M84.1
gcode:
  _CLEAR_HOMED
  M84.1 {rawparams}

[gcode_macro M18]
rename_existing: M18.1
gcode:
  _CLEAR_HOMED
  M18.1 {rawparams}

# --- I2 for Z moves that don't go through G1 ---------------------------------
[gcode_macro _CHECK_Z_DESCENT]
description: Refuse a non-G1 Z move from raw FROM to raw TO that breaks I2 (internal)
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set s = printer["gcode_macro _PLATE_STATE"] %}
  {% set gm = printer.gcode_move %}
  {% set en = printer.stepper_enable.steppers %}
  {% set eps = 0.001 %}
  {% set z_from = params.FROM|float %}
  {% set z_to = params.TO|float %}
  {% set ns = namespace(err="") %}
  {% if z_to > c.z_safe + eps and z_to > z_from + eps %}
    {% for p, ax in c.axes.items() %}
      {% if ns.err %}
      {% elif not (s[p] and en['manual_stepper ' ~ p] and ax in gm.axis_map) %}
        {% set ns.err = p ~ " not homed" %}
      {% else %}
        {% set pos = gm.position[gm.axis_map[ax]] %}
        {% set pmax = printer.configfile.settings['manual_stepper ' ~ p].position_max %}
        {% if not ((pos|abs) <= c.park_tol or ((pos - pmax)|abs) <= c.park_tol) %}
          {% set ns.err = p ~ " mid-travel (" ~ pos ~ ")" %}
        {% endif %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% if ns.err %}{action_raise_error("Move refused by interlock: " ~ ns.err)}{% endif %}

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_BASE
gcode:
  {% if params.MOVE|default(0)|int != 0 %}
    {% set gm = printer.gcode_move %}
    {% if 'Z' in params %}{% set dz = params.Z|float - gm.homing_origin.z %}
    {% elif 'Z_ADJUST' in params %}{% set dz = params.Z_ADJUST|float %}
    {% else %}{% set dz = 0.0 %}{% endif %}
    _CHECK_Z_DESCENT FROM={gm.position.z} TO={gm.position.z + dz}
  {% endif %}
  SET_GCODE_OFFSET_BASE {rawparams}

# Klipper doesn't expose saved states, so remember each one's raw Z here.
[gcode_macro _GSTATE]
description: Raw Z of each SAVE_GCODE_STATE name (internal)
variable_z: {}
gcode:

[gcode_macro SAVE_GCODE_STATE]
rename_existing: SAVE_GCODE_STATE_BASE
gcode:
  {% set name = params.NAME|default("default") %}
  {% if "'" in name or '"' in name or "\\" in name %}
    {action_raise_error("SAVE_GCODE_STATE refused: NAME must not contain quotes or backslashes")}
  {% endif %}
  {% set d = {} %}
  {% set _ = d.update(printer["gcode_macro _GSTATE"].z) %}
  {% set _ = d.update({name: printer.gcode_move.position.z}) %}
  SAVE_GCODE_STATE_BASE {rawparams}
  SET_GCODE_VARIABLE MACRO=_GSTATE VARIABLE=z VALUE="{d}"

# RESUME (pause_resume) runs RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1, so
# this check also covers Resume after a Pause.
[gcode_macro RESTORE_GCODE_STATE]
rename_existing: RESTORE_GCODE_STATE_BASE
gcode:
  {% if params.MOVE|default(0)|int != 0 %}
    {% set name = params.NAME|default("default") %}
    {% set saved = printer["gcode_macro _GSTATE"].z %}
    {% if name not in saved %}
      {action_raise_error("RESTORE_GCODE_STATE MOVE=1 refused: state '" ~ name ~ "' was not saved through SAVE_GCODE_STATE")}
    {% endif %}
    _CHECK_Z_DESCENT FROM={printer.gcode_move.position.z} TO={saved[name]}
  {% endif %}
  RESTORE_GCODE_STATE_BASE {rawparams}

# Default Klipper commands whose TESTZ moves Z directly (no G1). Not used on
# this machine, so refused outright: guarding only their start isn't enough,
# because a plate could move after the session starts.
[gcode_macro MANUAL_PROBE]
rename_existing: MANUAL_PROBE_BASE
description: Disabled on this machine (TESTZ would bypass the collision interlock)
gcode:
  {action_raise_error("MANUAL_PROBE is disabled on this machine: its TESTZ moves Z without the collision interlock")}

[gcode_macro Z_ENDSTOP_CALIBRATE]
rename_existing: Z_ENDSTOP_CALIBRATE_BASE
description: Disabled on this machine (TESTZ would bypass the collision interlock)
gcode:
  {action_raise_error("Z_ENDSTOP_CALIBRATE is disabled on this machine: its TESTZ moves Z without the collision interlock")}

[gcode_macro STEPPER_BUZZ]
rename_existing: STEPPER_BUZZ_BASE
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set st = params.STEPPER|default("")|lower|replace("manual_stepper ", "") %}
  {% set z = printer.gcode_move.position.z %}
  {% if st in c.axes %}
    {% if 'z' not in printer.toolhead.homed_axes or z > c.z_safe + 0.001 %}
      {action_raise_error("STEPPER_BUZZ on " ~ st ~ " refused: home Z and raise the tip first")}
    {% endif %}
  {% elif st.startswith("stepper_z") %}
    # Buzz moves the stepper 1 mm each way; treat it as a 1 mm descent.
    _CHECK_Z_DESCENT FROM={z} TO={z + 1}
  {% endif %}
  STEPPER_BUZZ_BASE {rawparams}

[gcode_macro _PIPETTE_BIND]
description: Bind pipette_stepper to its G-code axis if it isn't already
gcode:
  {% set pc = printer["gcode_macro _PIPETTE_CFG"] %}
  {% if pc.axis not in printer.gcode_move.axis_map %}
    MANUAL_STEPPER_BASE STEPPER=pipette_stepper GCODE_AXIS={pc.axis} LIMIT_VELOCITY={pc.limit_velocity} LIMIT_ACCEL={pc.limit_accel}
  {% endif %}

[delayed_gcode _PIPETTE_BIND_AT_START]
initial_duration: 1
gcode:
  _PIPETTE_BIND

[gcode_macro HOME_PIPETTE]
description: Home the plunger (also run by G28 P and bare G28). Same zero as tapd's homing today
gcode:
  {% set pc = printer["gcode_macro _PIPETTE_CFG"] %}
  {% set st = "STEPPER=pipette_stepper" %}
  {% set mv = "SPEED=" ~ pc.home_speed ~ " ACCEL=" ~ pc.home_accel %}
  SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0
  {% if pc.axis in printer.gcode_move.axis_map %}
    MANUAL_STEPPER_BASE {st} GCODE_AXIS=
  {% endif %}
  MANUAL_STEPPER_BASE {st} ENABLE=1
  # Start as if 2x travel away from the switch, then drive to 0 until it triggers
  # (the same deliberate overshoot tapd uses).
  # Write "{0 - x}", never "{-x}": in Klipper templates "{-" is Jinja's
  # whitespace-strip marker and the minus sign is silently dropped.
  MANUAL_STEPPER_BASE {st} SET_POSITION={0 - pc.home_dir * 2 * pc.max_travel}
  MANUAL_STEPPER_BASE {st} MOVE=0 {mv} STOP_ON_ENDSTOP=home
  # Back off until the switch releases, then call that point 0 (as tapd does).
  MANUAL_STEPPER_BASE {st} MOVE={0 - pc.home_dir * pc.max_travel} {mv} STOP_ON_ENDSTOP=inverted_home
  MANUAL_STEPPER_BASE {st} SET_POSITION=0
  SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=1
  _PIPETTE_BIND

# --- I3 (plates) and D21 (pipette transparent rebind) -------------------------
[gcode_macro MANUAL_STEPPER]
rename_existing: MANUAL_STEPPER_BASE
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set pc = printer["gcode_macro _PIPETTE_CFG"] %}
  {% set st = params.STEPPER|default("")|lower %}
  {% if st in c.axes %}
    {% if params['_PLATE_INTERNAL']|default(0)|int != 1 %}
      {action_raise_error("MANUAL_STEPPER on " ~ st ~ " refused: use HOME_PLATE / PLATE_* macros")}
    {% endif %}
    MANUAL_STEPPER_BASE {rawparams}
  {% elif st == "pipette_stepper" and pc.stage|int >= 2 %}
    # Stage 2: only HOME_PIPETTE (which uses MANUAL_STEPPER_BASE) may set the
    # plunger frame. Anything else sent here makes the plunger unhomed.
    SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0
    MANUAL_STEPPER_BASE {rawparams}
  {% elif st == "pipette_stepper" and 'GCODE_AXIS' not in params %}
    # Motors switched off by Klipper itself (e.g. a failed G28 calls motor_off
    # directly, not M84) leave the flag set; a disabled stepper is never homed.
    {% if not printer.stepper_enable.steppers['manual_stepper pipette_stepper'] %}
      SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0
    {% endif %}
    {% if 'SYNC' in params and params.SYNC|int == 0 %}
      {action_raise_error("SYNC=0 is not supported on pipette_stepper while it is bound to " ~ pc.axis)}
    {% endif %}
    {% set homing = params.STOP_ON_ENDSTOP|default("")|lower in ["home", "inverted_home"] %}
    {% if pc.axis in printer.gcode_move.axis_map %}
      MANUAL_STEPPER_BASE STEPPER=pipette_stepper GCODE_AXIS=
    {% endif %}
    {% if homing or ('ENABLE' in params and params.ENABLE|int == 0) %}
      SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0
    {% endif %}
    MANUAL_STEPPER_BASE {rawparams}
    {% if homing %}
      SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=1
    {% endif %}
    _PIPETTE_BIND
  {% else %}
    MANUAL_STEPPER_BASE {rawparams}
  {% endif %}

# --- I5: re-enabling a stepper by hand does not restore its homed state ------
[gcode_macro SET_STEPPER_ENABLE]
rename_existing: SET_STEPPER_ENABLE_BASE
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set st = params.STEPPER|default("")|lower|replace("manual_stepper ", "") %}
  {% if st.startswith(("stepper_x", "stepper_y", "stepper_z")) and params.ENABLE|default(1)|int == 0 %}
    # Klipper keeps a gantry axis "homed" after this; M84 unhomes it properly.
    {action_raise_error("SET_STEPPER_ENABLE ENABLE=0 on " ~ st ~ " refused: use M84 (it also unhomes the axis)")}
  {% endif %}
  {% if st in c.axes %}
    SET_GCODE_VARIABLE MACRO=_PLATE_STATE VARIABLE={st} VALUE=0
  {% elif st == "pipette_stepper" %}
    SET_GCODE_VARIABLE MACRO=_PIPETTE_STATE VARIABLE=homed VALUE=0
  {% endif %}
  SET_STEPPER_ENABLE_BASE {rawparams}

# --- I1/I2/I6: interlock on every linear move ---------------------------------
[gcode_macro G0]
rename_existing: G0.1
gcode:
  G1 {rawparams}

[gcode_macro G1]
rename_existing: G1.1
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set s = printer["gcode_macro _PLATE_STATE"] %}
  {% set gm = printer.gcode_move %}
  {% set en = printer.stepper_enable.steppers %}
  {% set eps = 0.001 %}
  # First failing check wins, so the message names the most basic cause.
  {% set ns = namespace(moving=[], err="") %}
  {% for p, ax in c.axes.items() %}
    {% if ax in params %}{% set ns.moving = ns.moving + [p] %}{% endif %}
  {% endfor %}
  {% set z_now = gm.position.z %}
  {% set z_off = gm.position.z - gm.gcode_position.z %}
  {% if 'Z' in params %}
    {% if gm.absolute_coordinates %}{% set z_tgt = params.Z|float + z_off %}
    {% else %}{% set z_tgt = z_now + params.Z|float %}{% endif %}
  {% else %}{% set z_tgt = z_now %}{% endif %}
  {% if ns.moving %}
    {% if 'z' not in printer.toolhead.homed_axes %}
      {% set ns.err = "Z not homed" %}
    {% elif z_now > c.z_safe + eps or z_tgt > c.z_safe + eps %}
      {% set ns.err = "tip below safe height (Z > " ~ c.z_safe ~ ")" %}
    {% endif %}
    {% for p in ns.moving %}
      {% if not ns.err and not (s[p] and en['manual_stepper ' ~ p] and c.axes[p] in gm.axis_map) %}{% set ns.err = p ~ " not homed" %}{% endif %}
    {% endfor %}
  {% elif z_tgt > c.z_safe + eps and z_tgt > z_now + eps %}
    {% for p, ax in c.axes.items() %}
      {% if ns.err %}
      {% elif not (s[p] and en['manual_stepper ' ~ p] and ax in gm.axis_map) %}
        {% set ns.err = p ~ " not homed" %}
      {% else %}
        {% set pos = gm.position[gm.axis_map[ax]] %}
        {% set pmax = printer.configfile.settings['manual_stepper ' ~ p].position_max %}
        {% if not ((pos|abs) <= c.park_tol or ((pos - pmax)|abs) <= c.park_tol) %}
          {% set ns.err = p ~ " mid-travel (" ~ pos ~ ")" %}
        {% endif %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% set pc = printer["gcode_macro _PIPETTE_CFG"] %}
  {% if pc.axis in params and not ns.err %}
    {% if pc.axis not in gm.axis_map %}
      {% set ns.err = "plunger axis " ~ pc.axis ~ " not bound (send any pipette_stepper command to rebind)" %}
    {% elif not (printer["gcode_macro _PIPETTE_STATE"].homed and en['manual_stepper pipette_stepper']) %}
      {% set ns.err = "plunger not homed" %}
    {% endif %}
  {% endif %}
  {% if ns.err %}{action_raise_error("Move refused by interlock: " ~ ns.err)}{% endif %}
  G1.1 {rawparams}

# --- Homing (I4) -------------------------------------------------------------
[gcode_macro HOME_PLATE]
description: Home one plate: PLATE=plate1..plate6
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set p = params.PLATE|lower %}
  {% if p not in c.axes %}{action_raise_error("Unknown plate " ~ p)}{% endif %}
  {% if 'z' not in printer.toolhead.homed_axes or printer.gcode_move.position.z > c.z_safe + 0.001 %}
    {action_raise_error("HOME_PLATE refused: home Z and raise the tip first")}
  {% endif %}
  {% set pmax = printer.configfile.settings['manual_stepper ' ~ p].position_max %}
  {% set I = "_PLATE_INTERNAL=1" %}
  SET_GCODE_VARIABLE MACRO=_PLATE_STATE VARIABLE={p} VALUE=0
  MANUAL_STEPPER STEPPER={p} GCODE_AXIS= {I}
  MANUAL_STEPPER STEPPER={p} ENABLE=1 {I}
  MANUAL_STEPPER STEPPER={p} SET_POSITION={pmax + 10} {I}
  MANUAL_STEPPER STEPPER={p} MOVE=0 SPEED={c.home_speed} STOP_ON_ENDSTOP=home {I}
  # The switch must RELEASE within home_backoff, or this errors. With an NC
  # switch a broken wire reads as permanently triggered; without this check the
  # drawer would "home" instantly wherever it is (D5 fail-safe).
  MANUAL_STEPPER STEPPER={p} MOVE={c.home_backoff} SPEED={c.home_speed_slow} STOP_ON_ENDSTOP=inverted_home {I}
  MANUAL_STEPPER STEPPER={p} MOVE={2 * c.home_backoff} SPEED={c.home_speed} {I}
  MANUAL_STEPPER STEPPER={p} MOVE=0 SPEED={c.home_speed_slow} STOP_ON_ENDSTOP=home {I}
  MANUAL_STEPPER STEPPER={p} GCODE_AXIS={c.axes[p]} LIMIT_VELOCITY={c.limit_velocity} LIMIT_ACCEL={c.limit_accel} {I}
  SET_GCODE_VARIABLE MACRO=_PLATE_STATE VARIABLE={p} VALUE=1

[gcode_macro HOME_PLATES]
description: Home all plates (requires Z homed and tip raised)
gcode:
  {% for p in printer["gcode_macro _PLATE_CFG"].axes %}
    HOME_PLATE PLATE={p}
  {% endfor %}

# --- Motion contract for tapd (umbrella section 6.3) -------------------------
# Checks I1 and the range up front, so a refusal leaves the G90/G91 mode and
# feed rate untouched (the G1 wrapper still checks again).
[gcode_macro _PLATE_PRECHECK]
description: Refuse PLATE_MOVE before any state changes (internal)
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set s = printer["gcode_macro _PLATE_STATE"] %}
  {% set gm = printer.gcode_move %}
  {% set p = params.PLATE %}
  {% set pos = params.POS|float %}
  {% set pmax = printer.configfile.settings['manual_stepper ' ~ p].position_max %}
  {% if 'z' not in printer.toolhead.homed_axes %}
    {action_raise_error("Move refused by interlock: Z not homed")}
  {% elif gm.position.z > c.z_safe + 0.001 %}
    {action_raise_error("Move refused by interlock: tip below safe height (Z > " ~ c.z_safe ~ ")")}
  {% elif not (s[p] and printer.stepper_enable.steppers['manual_stepper ' ~ p] and c.axes[p] in gm.axis_map) %}
    {action_raise_error("Move refused by interlock: " ~ p ~ " not homed")}
  {% elif pos < 0 or pos > pmax %}
    {action_raise_error("PLATE_MOVE refused: POS " ~ pos ~ " outside 0.." ~ pmax)}
  {% endif %}

[gcode_macro PLATE_MOVE]
description: PLATE=plateN POS=<mm> [SPEED=<mm/s>]
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set p = params.PLATE|lower %}
  {% if p not in c.axes %}{action_raise_error("Unknown plate " ~ p)}{% endif %}
  _PLATE_PRECHECK PLATE={p} POS={params.POS|float}
  {% set f = (params.SPEED|default(c.limit_velocity)|float) * 60 %}
  SAVE_GCODE_STATE NAME=_plate_move
  G90
  G1 {c.axes[p]}{params.POS|float} F{f}
  RESTORE_GCODE_STATE NAME=_plate_move

[gcode_macro PLATE_IN]
gcode:
  PLATE_MOVE PLATE={params.PLATE} POS=0 {% if params.SPEED %}SPEED={params.SPEED}{% endif %}

[gcode_macro PLATE_OUT]
gcode:
  {% set pmax = printer.configfile.settings['manual_stepper ' ~ params.PLATE|lower].position_max %}
  PLATE_MOVE PLATE={params.PLATE} POS={pmax} {% if params.SPEED %}SPEED={params.SPEED}{% endif %}

[gcode_macro PLATES_IN]
gcode:
  {% for p in printer["gcode_macro _PLATE_CFG"].axes %}PLATE_IN PLATE={p}
  {% endfor %}

[gcode_macro QUERY_PLATES]
description: Report homed / position / parked for each plate
gcode:
  {% set c = printer["gcode_macro _PLATE_CFG"] %}
  {% set s = printer["gcode_macro _PLATE_STATE"] %}
  {% set gm = printer.gcode_move %}
  {% set out = [] %}
  {% for p, ax in c.axes.items() %}
    {% set h = s[p] and printer.stepper_enable.steppers['manual_stepper ' ~ p] %}
    {% set pos = gm.position[gm.axis_map[ax]] if ax in gm.axis_map else none %}
    {% set _ = out.append(p ~ " " ~ ax ~ " homed=" ~ h ~ " pos=" ~ pos) %}
  {% endfor %}
  {action_respond_info(out|join("\n"))}
