# ebb-pipette.cfg -- pipette plunger stepper and tip-eject servo on the EBB42
#
# Board: BTT EBB42 CAN V1.2 (STM32G0B1, 8 MHz, CAN PB0/PB1, 1 Mbit/s, 8 KiB
# Katapult bootloader). Firmware Kconfig: reference/firmware/ebb42-v1.2.config.
# Pins: Klipper config/sample-bigtreetech-ebb-canbus-v1.2.cfg, plus the BTT
# EBB42 V1.1/V1.2 pinout image for PB7 (endstop) and PB9 (servo) -- verified (plan Rev I).
# No MCU IDs here: [mcu EBBCan] canbus_uuid is written per machine by bootstrap.

[manual_stepper pipette_stepper]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1          # VERIFY: must reproduce the old M8P direction (M-01)
enable_pin: !EBBCan:PD2
endstop_pin: ^!EBBCan:PB7     # Pin verified; VERIFY polarity with E-05 (old M8P: ^!PB10)
microsteps: 16
# (Carry over the full rotation_distance / issue #29 comment from
#  tricca-autopipette.cfg verbatim when moving this section.)
rotation_distance: 2
# Stage 1: no position_min/position_max -- today's tapd re-zeroes this stepper
# around every syringe operation and homes with a 2x overshoot MOVE.
# Stage 2 (lands with tapd TAP-6, see stage2.patch.md): position_min: -60,
# position_max: 0 (home_dir = +1, 60 mm travel), together with
# variable_stage: 2 in plate-macros.cfg (the offline tests check they agree).
# Bound to G-code axis P at startup by plate-macros.cfg; homed by
# HOME_PIPETTE / G28 P. P0 = switch-release point (same zero as tapd today).

[tmc2209 manual_stepper pipette_stepper]
uart_pin: EBBCan:PA15
interpolate: false
run_current: 0.650
stealthchop_threshold: 0

[servo pipette_servo]
# MG996R. Signal only from the EBB; 6 V (as today) comes from a separate
# >=3 A 24->6 V converter (stall current up to ~2.5 A exceeds the EBB's 1 A 5 V rail).
pin: EBBCan:PB9               # Verified on the EBB42 V1.1/V1.2 pinout (probe header)
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

[temperature_sensor ebb42]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
