enable_pin: !octopus:PG5
endstop_pin: ^octopus:PG10   # NC to GND: low = OK, high = triggered (VERIFY, E-05)
microsteps: 16
rotation_distance: 40          # GT2 belt, 20T pulley
velocity: 50
