# octopus-plates.cfg -- six plate-drawer steppers on the Octopus V1.1
#
# Board: BTT Octopus V1.1 **non-Pro, STM32F446** (32 KiB bootloader, 12 MHz,
# USB). Firmware Kconfig: reference/firmware/octopus-v1.1-f446.config.
# Pins: Klipper config/generic-bigtreetech-octopus-v1.1.cfg (non-Pro only).
# NOT for an Octopus Pro: its pin map differs (Driver3 enable is PA2 there,
# and PA0 is a heater output).
# Hardware: main power and motor power inputs both 24 V (fuse F2), all DIAG
# jumpers REMOVED, TMC2209 in UART mode. Drivers 6-7 (PE2/PE3/!PD4,
# PE6/PA14/!PE0) are spares.
# Home switches: NC to GND at the drawer's "in" end; +position = drawer OUT.
# position_max 350 = owner-specified drawer travel, confirmed against the
# mechanical design (plan Rev I).
# Homing (HOME_PLATE) requires the switch to release after the first touch, so a
# broken NC wire fails homing instead of faking a home (plan D5).
# No MCU IDs here: [mcu octopus] serial is written per machine by bootstrap.

[manual_stepper plate1]
# axis U; endstop header STOP_0
step_pin: octopus:PF13
dir_pin: octopus:PF12          # VERIFY: +position moves the drawer OUT (M-02)
enable_pin: !octopus:PF14
endstop_pin: ^octopus:PG6   # NC to GND: low = OK, high = triggered (VERIFY, E-05)
microsteps: 16
rotation_distance: 40          # GT2 belt, 20T pulley
velocity: 50
accel: 500                     # ~0.05 g; tune with the spill test (M-19)
position_min: 0
position_max: 350

[tmc2209 manual_stepper plate1]
uart_pin: octopus:PC4
run_current: 1.000             # ~60% of the LDO-42STH40-1684AC's 1.68 A
stealthchop_threshold: 0

