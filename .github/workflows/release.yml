name: Release

# Builds and publishes a GitHub Release when a `vX.Y.Z` tag is pushed.
#
# Deliberately does NOT re-run ruff/pyright/pytest: a tag on `main` has
# already passed the (separate, issue #19) CI workflow's required-checks
# gate, so re-running here would just duplicate that work. See issue #22 and
# RELEASING.md for the full release process this workflow is the last step
# of.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
