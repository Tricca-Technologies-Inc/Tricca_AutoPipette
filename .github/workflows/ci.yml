name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every tool version (ruff, pyright, pytest-playwright, ...) comes from
# pyproject.toml's exact-pinned extras via the committed uv.lock (issue #24);
# `--frozen` fails rather than silently re-resolving if the lock is stale.
#
# lint/typecheck/test run on both x86_64 and native aarch64 (the Pi-class
# deploy target). The x86_64 job keeps the bare job name (`lint`, not
# `lint (ubuntu-latest)`) because that's what the `main` branch ruleset's
# required checks match on; the arm64 jobs report as `<job> (arm64)`.

jobs:
  lint:
    name: lint${{ matrix.suffix }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, suffix: "" }
          - { os: ubuntu-24.04-arm, suffix: " (arm64)" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags upstream
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  typecheck:
    name: typecheck${{ matrix.suffix }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, suffix: "" }
          - { os: ubuntu-24.04-arm, suffix: " (arm64)" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags upstream
        with:
          python-version: "3.12"
          enable-cache: true
      # browser-test is installed too (not just dev) -- pyright type-checks
      # tests/kiosk/browser/*.py by default (testpaths covers all of
      # tests/), and without the playwright package on the path every
      # import there is unresolved, cascading into hundreds of spurious
      # Unknown-type errors unrelated to the actual code.
      - run: uv sync --frozen --extra dev --extra browser-test
      - run: uv run --frozen pyright

  test:
    name: test${{ matrix.suffix }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, suffix: "" }
          - { os: ubuntu-24.04-arm, suffix: " (arm64)" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags upstream
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q

  # x86_64 only: this exercises the kiosk frontend in a real browser, which
  # isn't architecture-sensitive -- the arm64 `test` job already covers the
  # Python side on the deploy architecture.
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags upstream
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra browser-test
      # Key the browser cache on the locked playwright version (the browser
      # build is tied to it), not on uv.lock as a whole -- lockfile
      # maintenance touches that far more often than playwright moves.
      - name: Resolve playwright version
        id: playwright
        run: echo "version=$(uv run --frozen python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache chromium
        id: cache-chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: uv run --frozen playwright install --with-deps chromium
      - name: Install chromium OS deps only (cache hit)
        if: steps.cache-chromium.outputs.cache-hit == 'true'
        run: uv run --frozen playwright install-deps chromium
      - run: uv run --frozen pytest -q
